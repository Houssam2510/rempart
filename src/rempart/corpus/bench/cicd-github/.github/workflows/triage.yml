name: triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: unsafe
# rempart-expect: GHA-SCRIPT-INJECTION
        run: echo "New issue ${{ github.event.issue.title }}"
      - name: safe
        env:
          TITLE: ${{ github.event.issue.title }}
# rempart-safe: GHA-SCRIPT-INJECTION
        run: echo "New issue $TITLE"
