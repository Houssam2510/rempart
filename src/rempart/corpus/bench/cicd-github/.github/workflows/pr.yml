name: pr
on: pull_request_target
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
# rempart-expect: GHA-PWN-REQUEST
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci && npm test
