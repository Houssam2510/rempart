# Rempart scanning Rempart.
# tests/, examples/ and the bench corpus hold intentionally vulnerable code: scanning them would only prove the tests work.
exclude = ["tests/**", "examples/**", "src/rempart/corpus/bench/**"]

[severity]
# Scanner modules are flat rule tables (one `if` per check, no nesting). Cyclomatic
# complexity counts each check as a branch, so keep it visible but low here.
"QUAL-COMPLEXITY" = "low"
